<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 165" width="100%" height="165">
  <style>
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .math { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: italic; }
    .math-normal { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: normal; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #334155; }
    .sub { font-size: 11px; }
    .sup { font-size: 11px; }
  </style>
  <rect width="820" height="165" fill="#ffffff" rx="6" />
  <text x="25" y="42"><tspan class="label">Smile per expiry: </tspan><tspan class="math-normal">σ</tspan><tspan class="sub">i</tspan><tspan class="math-normal">(</tspan><tspan class="math">k</tspan><tspan class="math-normal">) fit to OTM put/call mids, </tspan><tspan class="math">k</tspan><tspan class="math-normal"> = ln(</tspan><tspan class="math">K</tspan><tspan class="math-normal">/</tspan><tspan class="math">F</tspan><tspan class="math-normal">)</tspan></text>
  <text x="25" y="84"><tspan class="label">Interpolate to 2 years: </tspan><tspan class="math-normal">σ(</tspan><tspan class="math">k</tspan><tspan class="math-normal">)²·2 = (1−</tspan><tspan class="math">w</tspan><tspan class="math-normal">)·σ₁(</tspan><tspan class="math">k</tspan><tspan class="math-normal">)²·</tspan><tspan class="math">T</tspan><tspan class="math-normal">₁ + </tspan><tspan class="math">w</tspan><tspan class="math-normal">·σ₂(</tspan><tspan class="math">k</tspan><tspan class="math-normal">)²·</tspan><tspan class="math">T</tspan><tspan class="math-normal">₂,   </tspan><tspan class="math">T</tspan><tspan class="math-normal">₁ ≤ 2 &lt; </tspan><tspan class="math">T</tspan><tspan class="math-normal">₂</tspan></text>
  <text x="25" y="126"><tspan class="desc">If no expiry reaches 2 years: σ(k) at 2y = σ at the longest expiry, matched on k/√T (flagged *).</tspan></text>
</svg>