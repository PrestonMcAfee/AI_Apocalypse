name: Daily Drawdown Probability Update

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
  schedule:
    - cron: '19 14-23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run probability calculations
        run: python build_site.py

      - name: Check if site was updated
        id: site_check
        run: |
          if git diff --quiet index.html && git diff --quiet history.csv; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No valid market update produced (overnight/stale quotes or today already complete). Skipping deploy."
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated history.csv
        if: steps.site_check.outputs.updated == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add history.csv
          if ! git diff --staged --quiet; then
            git commit -m "chore: record daily probability snapshot [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Setup Pages
        if: steps.site_check.outputs.updated == 'true'
        uses: actions/configure-pages@v5

      - name: Package site artifact
        if: steps.site_check.outputs.updated == 'true'
        run: tar --exclude='.git' --exclude='.github' -cvf /tmp/artifact.tar .

      - name: Upload artifact
        if: steps.site_check.outputs.updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: /tmp/artifact.tar
          retention-days: 1

      - name: Deploy to GitHub Pages
        if: steps.site_check.outputs.updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
