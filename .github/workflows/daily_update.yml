name: Daily Drawdown Probability Update

# Hourly attempts each weekday at :07 past the hour. The cron covers both
# EST and EDT; build_site.py itself exits outside 10:00-15:55 US/Eastern, so
# the effective attempts are 10:07am-3:07pm Eastern all year (six tries).
# build_site.py also exits once the day has a complete run, and a later run
# never overwrites an earlier, cleaner snapshot for the same day.
#
# Manual "Run workflow": always recalculates (ignores the time window and the
# already-complete check). Tick "overwrite" to replace today's data even if an
# earlier run was cleaner. No need to delete rows from the history files.
on:
  schedule:
    - cron: '7 14-20 * * 1-5'
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Replace today's data even if an earlier run today was cleaner"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run probability calculations
        id: build
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          OVERWRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite }}
        run: python build_site.py

      - name: Commit and push updated history files
        if: steps.build.outputs.updated == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          for f in history.csv history52.csv skew_curve.csv last_run.json index_base.json; do [ -f "$f" ] && git add "$f"; done
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: record daily probability snapshot [skip ci]" && git push)

      - name: Setup Pages
        if: steps.build.outputs.updated == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.build.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # GitHub occasionally reports the just-uploaded artifact as missing; retry once.
      - name: Deploy to GitHub Pages
        if: steps.build.outputs.updated == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deploy
        if: ${{ steps.build.outputs.updated == 'true' && steps.deployment.outcome == 'failure' }}
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        if: ${{ steps.build.outputs.updated == 'true' && steps.deployment.outcome == 'failure' }}
        uses: actions/deploy-pages@v4
