<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 165" width="100%" height="165">
  <style>
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .math { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: italic; }
    .math-normal { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: normal; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #334155; }
    .sub { font-size: 11px; }
    .sup { font-size: 11px; }
  </style>
  <rect width="820" height="165" fill="#ffffff" rx="6" />
  <text x="25" y="42"><tspan class="label">Dynamic Risk-Free Rate: </tspan><tspan class="math">r</tspan><tspan class="math-normal"> = Yield(2YY=F) / 100</tspan></text>
  <text x="25" y="84"><tspan class="label">Live Forward (put-call parity): </tspan><tspan class="math">F</tspan><tspan class="math-normal"> = </tspan><tspan class="math">K</tspan><tspan class="math-normal"> + </tspan><tspan class="math">e</tspan><tspan class="sup">rT</tspan><tspan class="math-normal">(</tspan><tspan class="math">C</tspan><tspan class="math-normal"> − </tspan><tspan class="math">P</tspan><tspan class="math-normal">), near-the-money strikes</tspan></text>
  <text x="25" y="126"><tspan class="label">Historical Forward: </tspan><tspan class="math">F</tspan><tspan class="math-normal"> = </tspan><tspan class="math">S</tspan><tspan class="sub">0</tspan><tspan class="math"> e</tspan><tspan class="sup">(r − q)T</tspan><tspan class="math-normal">, </tspan><tspan class="math">q</tspan><tspan class="math-normal"> = trailing 12-month dividend yield</tspan></text>
</svg>