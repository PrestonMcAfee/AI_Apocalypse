<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 165" width="100%" height="165">
  <style>
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .math { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: italic; }
    .math-normal { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: normal; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #334155; }
    .sub { font-size: 11px; }
    .sup { font-size: 11px; }
  </style>
  <rect width="820" height="165" fill="#ffffff" rx="6" />
  <text x="25" y="42"><tspan class="label">Two-year volatility proxy: </tspan><tspan class="math-normal">σ</tspan><tspan class="sub">proxy</tspan><tspan class="math-normal">² = 0.3 · (RV</tspan><tspan class="sub">63d</tspan><tspan class="math-normal">)² + 0.7 · (RV</tspan><tspan class="sub">504d</tspan><tspan class="math-normal">)²</tspan></text>
  <text x="25" y="84"><tspan class="label">Per-ticker multiplier: </tspan><tspan class="math">m</tspan><tspan class="math-normal"> = median over live days of σ</tspan><tspan class="sub">eff</tspan><tspan class="math-normal"> / σ</tspan><tspan class="sub">proxy</tspan><tspan class="math-normal">,  where N(−</tspan><tspan class="math">d</tspan><tspan class="sub">2</tspan><tspan class="math-normal">(σ</tspan><tspan class="sub">eff</tspan><tspan class="math-normal">)) = </tspan><tspan class="math">Q</tspan><tspan class="sub">live</tspan></text>
  <text x="25" y="126"><tspan class="label">Historical probability: </tspan><tspan class="math">Q</tspan><tspan class="math-normal"> = N(−</tspan><tspan class="math">d</tspan><tspan class="sub">2</tspan><tspan class="math-normal">) with σ = </tspan><tspan class="math">m</tspan><tspan class="math-normal"> · σ</tspan><tspan class="sub">proxy</tspan></text>
</svg>