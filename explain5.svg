  </style>
  <rect width="820" height="130" fill="#ffffff" rx="6" />
  <text x="25" y="48"><tspan class="label">Risk-Neutral Tail Probability: </tspan><tspan class="math">Q</tspan><tspan class="math-normal">(</tspan><tspan class="math">S</tspan><tspan class="sub">T</tspan><tspan class="math-normal"> ≤ </tspan><tspan class="math">K</tspan><tspan class="math-normal">) = N(−</tspan><tspan class="math">d</tspan><tspan class="sub">2</tspan><tspan class="math-normal">)</tspan></text>
  <text x="25" y="92"><tspan class="math-normal">where </tspan><tspan class="math">d</tspan><tspan class="sub">2</tspan><tspan class="math-normal"> = [ ln(</tspan><tspan class="math">S</tspan><tspan class="sub">0</tspan><tspan class="math-normal">/</tspan><tspan class="math">K</tspan><tspan class="math-normal">) + (</tspan><tspan class="math">r</tspan><tspan class="math-normal"> − </tspan><tspan class="math">q</tspan><tspan class="math-normal"> − ½σ</tspan><tspan class="sub">wing</tspan><tspan class="sup">2</tspan><tspan class="math-normal">)</tspan><tspan class="math">T</tspan><tspan class="math-normal"> ] / ( σ</tspan><tspan class="sub">wing</tspan><tspan class="math-normal">√</tspan><tspan class="math">T</tspan><tspan class="math-normal"> )</tspan></text>
</svg>