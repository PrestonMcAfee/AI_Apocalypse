<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 130" width="100%" height="130">
  <style>
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .math { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: italic; }
    .math-normal { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: normal; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #334155; }
    .sub { font-size: 11px; }
    .sup { font-size: 11px; }
  </style>
  <rect width="820" height="130" fill="#ffffff" rx="6" />
  <text x="25" y="48"><tspan class="label">Downside Wing Volatility: </tspan><tspan class="math-normal">σ</tspan><tspan class="sub">wing</tspan><tspan class="math-normal"> = 1.18 × σ</tspan><tspan class="sub">ATM</tspan></text>
  <text x="25" y="90"><tspan class="desc">Captures structural implied volatility smile for deep 50% out-of-the-money puts over a 2-year horizon.</tspan></text>
