  <rect width="820" height="130" fill="#ffffff" rx="6" />
  <text x="25" y="48"><tspan class="label">Risk-Neutral Tail Probability: </tspan><tspan class="math">Q</tspan><tspan class="math-normal">(</tspan><tspan class="math">S</tspan><tspan class="sub">T</tspan><tspan class="math-normal"> ≤ </tspan><tspan class="math">K</tspan><tspan class="math-normal">) = </tspan><tspan class="math">e</tspan><tspan class="sup">rT</tspan><tspan class="math-normal"> ∂</tspan><tspan class="math">Put</tspan><tspan class="math-normal">(</tspan><tspan class="math">K</tspan><tspan class="math-normal">, </tspan><tspan class="math">T</tspan><tspan class="math-normal">)/∂</tspan><tspan class="math">K</tspan><tspan class="math-normal">,  </tspan><tspan class="math">K</tspan><tspan class="math-normal"> = 0.5 </tspan><tspan class="math">S</tspan><tspan class="sub">0</tspan></text>
  <text x="25" y="92"><tspan class="math-normal">= N(−</tspan><tspan class="math">d</tspan><tspan class="sub">2</tspan><tspan class="math-normal">) + </tspan><tspan class="math">e</tspan><tspan class="sup">rT</tspan><tspan class="math-normal"> · Vega · ∂σ/∂</tspan><tspan class="math">K</tspan><tspan class="desc">     (the second term is the skew correction)</tspan></text>
