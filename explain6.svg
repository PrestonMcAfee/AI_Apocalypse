<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 130" width="100%" height="130">
  <style>
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .math { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: italic; }
    .math-normal { font-family: "Cambria Math", "Times New Roman", Times, serif; font-size: 17px; fill: #1e293b; font-style: normal; }
    .desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #334155; }
    .sub { font-size: 11px; }
    .sup { font-size: 11px; }
  </style>
  <rect width="820" height="130" fill="#ffffff" rx="6" />
  <text x="25" y="48"><tspan class="label">Physical Equity Drift (CAPM): </tspan><tspan class="math-normal">μ = </tspan><tspan class="math">r</tspan><tspan class="math-normal"> + β × ERP − </tspan><tspan class="math">q</tspan><tspan class="math-normal">, where ERP = 4.5%</tspan></text>
  <text x="25" y="92"><tspan class="label">Physical Tail Probability: </tspan><tspan class="math">P</tspan><tspan class="math-normal">(</tspan><tspan class="math">S</tspan><tspan class="sub">T</tspan><tspan class="math-normal"> ≤ </tspan><tspan class="math">K</tspan><tspan class="math-normal">) = </tspan><tspan class="math">Q</tspan><tspan class="math-normal">(</tspan><tspan class="math">S</tspan><tspan class="sub">T</tspan><tspan class="math-normal"> ≤ </tspan><tspan class="math">K</tspan><tspan class="math-normal">·</tspan><tspan class="math">e</tspan><tspan class="sup">−β·ERP·T</tspan><tspan class="math-normal">)</tspan></text>
</svg>